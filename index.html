<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book Nest: find books, shelve them, track your pages and rate what you finish.">
  <title>Book Nest</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="6" y="8" width="7" height="26" rx="1.5"/>
          <rect x="15" y="5" width="7" height="29" rx="1.5"/>
          <rect x="24.5" y="9" width="7" height="25" rx="1.5" transform="rotate(-12 28 21.5)"/>
        </svg>
        <h1>Book Nest</h1>
      </div>
      <p class="summary" id="summary">Your shelf is empty. Find a book below to start.</p>
    </header>

    <section class="finder" aria-labelledby="finderLabel">
      <form id="addForm" class="add" autocomplete="off">
        <label id="finderLabel" class="add-label" for="titleInput">Add a book</label>
        <div class="add-row">
          <div class="combo">
            <input id="titleInput" class="field" type="text" placeholder="Search by title or author"
                   role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list" required>
            <span class="spinner" id="spinner" hidden></span>
            <ul class="suggest" id="suggest" role="listbox" hidden></ul>
          </div>
          <button class="btn primary" type="submit">Add to shelf</button>
        </div>
        <p class="hint" id="hint">Pick a match to fill in the author, cover and page count. Or press Add to shelf to add the title as typed.</p>
      </form>
    </section>

    <section class="shelf" aria-labelledby="shelfLabel">
      <div class="shelf-head">
        <h2 id="shelfLabel" class="sr-only">Your shelf</h2>
        <div class="tabs" role="tablist" aria-label="Filter by status">
          <button role="tab" data-filter="all" aria-selected="true">All <span data-n="all"></span></button>
          <button role="tab" data-filter="want" aria-selected="false">To read <span data-n="want"></span></button>
          <button role="tab" data-filter="reading" aria-selected="false">Reading <span data-n="reading"></span></button>
          <button role="tab" data-filter="done" aria-selected="false">Finished <span data-n="done"></span></button>
        </div>
        <div class="tools">
          <label class="sr-only" for="findInput">Search your shelf</label>
          <input id="findInput" class="field small" type="search" placeholder="Search shelf">
          <label class="sr-only" for="sortSelect">Sort</label>
          <select id="sortSelect" class="field small">
            <option value="recent">Recently added</option>
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="progress">Progress</option>
          </select>
        </div>
      </div>

      <ul class="books" id="books" aria-live="polite"></ul>
      <div class="empty" id="empty" hidden></div>
    </section>

    <footer class="foot">
      Built by Laminez. Book data and covers come from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>. Your shelf is saved in this browser only.
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastAction" class="toast-action" hidden>Undo</button>
  </div>
</body>
</html>
